{% extends 'base.html' %}

{% block content %}
    <div class="form-container">
        <h2>Confirm Delete</h2>
        <p>Are you sure you want to delete "{{ object }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="form-button" style="background-color: #e74c3c;">Confirm Delete</button>
            <a href="javascript:history.back()" class="form-button" style="background-color: #6c757d;">Cancel</a>
        </form>
    </div>
{% endblock %}
