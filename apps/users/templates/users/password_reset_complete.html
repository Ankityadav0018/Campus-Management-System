{% extends 'base.html' %}

{% block title %}Password Reset Complete - LPU Campus{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="user-icon">✅</div>
            <h2>Password Reset Complete</h2>
            <p>Your password has been successfully reset</p>
        </div>

        <div style="text-align: center; padding: 2rem 0;">
            <p style="margin-bottom: 1.5rem;">You can now log in with your new password.</p>
            <a href="{% url 'users:login' %}" class="btn-login" style="display: inline-block;">
                🚀 Go to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
