services:
  - type: web
    name: campus-management
    env: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn campus_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: campus-db
          property: connectionString
  
  - type: pserv
    name: campus-db
    env: postgres
    plan: free
    ipAllowList: []
    postDeployCommand: >
      python manage.py migrate
