<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Face for {{ student_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Register Face for {{ student_name }}</h1>
        <a href="{{ url_for('students_list') }}" class="button back-button">Back to Student List</a>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flashes">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data">
            <label for="file">Upload Image (single face only):</label>
            <input type="file" id="file" name="file" accept="image/*" required>

            <button type="submit">Register Face</button>
        </form>
    </div>
</body>
</html>
